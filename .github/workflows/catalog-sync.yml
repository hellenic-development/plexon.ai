name: Catalog Sync

on:
  schedule:
    # Every Monday at 04:00 UTC — when models.dev has usually settled after
    # the weekend's edits. Manual dispatch available via the Actions tab.
    - cron: '0 4 * * 1'
  workflow_dispatch:
  # The validate job below is the vendor-denylist gate (catalog/scripts/denylist.go).
  # It has to run on pull requests or a hand edit reintroducing a denied model
  # merges unchecked — including the weekly sync's own PR.
  pull_request:
    paths:
      - 'catalog/**'

# Cancel in-flight runs when a newer one is queued; the latest upstream data
# is always what we want.
concurrency:
  # Keyed by ref so two open pull requests do not cancel each other's validation.
  # The scheduled sync still collapses to one run, which is the original intent.
  group: catalog-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Never on pull_request: this job opens a PR, and doing that from a PR loops.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: catalog/go.sum

      - name: Sync from models.dev
        run: go run ./scripts/sync_models_dev

      - name: Rebuild snapshot
        run: go run ./scripts/build_snapshot

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(catalog): weekly models.dev sync'
          title: 'chore(catalog): weekly models.dev sync'
          branch: catalog/sync-models-dev
          body: |
            Automated weekly sync from [models.dev/api.json](https://models.dev/api.json).

            - Latest-per-family filter applied (see `catalog/README.md` for rules).
            - `plexon` and `claude-desktop` untouched (hand-authored).
            - `snapshots/latest.json` regenerated.

            Review the model diffs per provider before merging. Empty diffs
            mean upstream didn't change anything we care about this week.
          delete-branch: true

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: catalog/go.sum
      # `build_snapshot` doubles as two validators: any YAML that fails to parse
      # into the Go catalog types fails the build, and so does any model from a
      # denied vendor (scripts/denylist.go). The second is a compliance gate,
      # not a style check — read the godoc there before touching it.
      - name: Validate provider YAMLs and enforce the vendor denylist
        run: go run ./scripts/build_snapshot -out /tmp/validate.json

      # The snapshot is the artifact clients actually fetch, so a PR that edits
      # a provider YAML without rebuilding it publishes stale data.
      - name: Check snapshots/latest.json is up to date
        run: |
          go run ./scripts/build_snapshot
          if ! git diff --quiet -- snapshots/latest.json; then
            echo "::error::snapshots/latest.json is stale. Run 'go run ./scripts/build_snapshot' in catalog/ and commit the result."
            git diff --stat -- snapshots/latest.json
            exit 1
          fi
