name: moonshot
display_name: Moonshot AI
compatibility: openai
requires_api_key: true
supports_web_search: true
base_url: https://api.moonshot.ai/v1
default_model: kimi-for-coding
builtin_tools:
    web_search: []
models:
    - id: kimi-for-coding
      name: Kimi For Coding
      base_url: https://api.kimi.com/coding/v1
      headers:
        HTTP-Referer: https://plexon.ai
        User-Agent: Kilo-Code/7.2.26
        X-PlexonAI-Version: 4.110.0
        X-Stainless-Runtime: node
        X-Stainless-Runtime-Version: v22.19.0
        X-Title: Plexon AI
      limit: 262144
      reserved_tokens: 32768
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      default_selection: true
      pricing:
        is_subscription: true
    - id: kimi-k3.1-pro
      name: Kimi K3.1 Pro
      # K3.1 Pro (2026-10-23) is the post-trained successor to K3 on the same
      # line at a lower price, so K3 left this file (sync.excluded). Thinking
      # cannot be turned off (the vendor FAQ: always on; a disable is a 400), the
      # depth is a top-level reasoning_effort of low/high/max with max as the
      # platform's absent-field default, and temperature (1.0) and top_p (0.95)
      # are fixed, hence no supports_custom_temperature and no sampling block.
      # Authored from platform.kimi.com, not probed: no platform key is held.
      limit: 1048576
      reserved_tokens: 32768
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      thinking_always_on: true
      release_date: "2026-10-23"
      pricing:
        input: 2
        output: 10
        cache_write: 2
        cache_read: 0.2
    - id: kimi-k3.1-pro-highspeed
      name: Kimi K3.1 Pro Highspeed
      # The same model served two to three times faster at twice the input and
      # output price; cache hits stay at $0.20 on the vendor's pricing page.
      # Same contract as the row above.
      limit: 1048576
      reserved_tokens: 32768
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      thinking_always_on: true
      release_date: "2026-10-23"
      pricing:
        input: 4
        output: 20
        cache_write: 4
        cache_read: 0.2
    - id: kimi-k3.1-pro-coding-plan
      # Wire id per kimi.com/code docs (Model Configuration): third-party tools
      # send plain "k3.1-pro" ("k3.1-pro[1m]" is a Claude Code env-var-only
      # 1M-context alias). A mistyped id is silently served by K2.8 Preview.
      wire_id: k3.1-pro
      name: Kimi K3.1 Pro (Subscription)
      # Anthropic-compat, on purpose: the premium->pro fallback re-resolves an
      # exhausted Kimi to MiniMax M3 (Anthropic-based), so keeping Kimi on the
      # SAME protocol keeps a premium session coherent across the fallback and
      # continuation (an OpenAI-shaped history served to an Anthropic model
      # breaks). The coding plan's Anthropic surface is on the CODING host
      # (api.kimi.com/coding, its ANTHROPIC_BASE_URL) + /v1/messages, NOT the
      # pay-as-you-go platform (api.moonshot.ai/anthropic, which 401s a
      # coding-plan key). Our anthropic client appends "/messages", so the base
      # carries /v1. Auth is Authorization: Bearer, sent by setAnthropicAuth.
      # (OpenAI variant of this same host/path works: /coding/v1/chat/completions.)
      compatibility: anthropic
      # The coding host has two documented base URLs, api.kimi.com/coding (the
      # China-region one) and api.kimi.ai/coding (overseas). This stays on .com:
      # ServesKimiCoding keys on that host and the owner's key was probed there
      # on 2026-08-26.
      base_url: https://api.kimi.com/coding/v1
      headers:
        HTTP-Referer: https://plexon.ai
        User-Agent: Kilo-Code/7.2.26
        X-PlexonAI-Version: 4.110.0
        X-Stainless-Runtime: node
        X-Stainless-Runtime-Version: v22.19.0
        X-Title: Plexon AI
      # 1M context window (Allegretto plan and above; plain "k3" grants the
      # plan's full window on the API, the "[1m]" suffix is Claude-Code-only).
      # Held at a round 1,000,000 to match MiniMax M3 exactly. The two back the
      # premium and pro text cells and the premium->pro fallback re-resolves
      # between them mid-session, so identical windows mean a conversation that
      # fits one always fits the other: a downgrade can never land on a
      # context-length rejection.
      limit: 1000000
      reserved_tokens: 32768
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      # Thinking cannot be turned off on K3.1 Pro: a disable is a 400 on the
      # coding host too (K3's off switch used to re-route to K2.8 Preview), and
      # the server already serves Off as the lowest effort on this host. No
      # sampling block: the 2026-08-26 temperature probe on this host was run on
      # K3, and the vendor fixes temperature at 1.0 for K3.1 Pro, so nothing
      # about sampling here is measured.
      thinking_always_on: true
      pricing:
        is_subscription: true
sync:
    family_strip: -k\d+(?:\.\d+)?
    pinned:
        - kimi-for-coding
        - kimi-k3.1-pro
        - kimi-k3.1-pro-coding-plan
        - kimi-k3.1-pro-highspeed
    excluded:
        - kimi-k2.6
        - kimi-k2-thinking
        - kimi-k2-thinking-turbo
        - kimi-k2-turbo
        - kimi-k3
        - kimi-k3-coding-plan
