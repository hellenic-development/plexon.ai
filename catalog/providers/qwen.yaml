    - id: qwen3.8-max (Token Plan)
      wire_id: qwen3.8-max
      name: Qwen3.8 Max (Token Plan)
      # Anthropic-compat, on purpose: this model backs the PREMIUM rung of the
      # Plexon chain and the fallback re-resolves it to Kimi K3 / MiniMax M3
      # (both Anthropic-based), so keeping every rung on the SAME protocol
      # keeps a premium session coherent across a mid-chain downgrade and
      # continuation. The Token Plan's Anthropic surface serves
      # /apps/anthropic/v1/messages; our anthropic client appends "/messages",
      # so the base carries /apps/anthropic/v1. Auth is Authorization: Bearer
      # (ANTHROPIC_AUTH_TOKEN per Alibaba's Claude Code docs), sent by
      # setAnthropicAuth. Probe-verified 2026-08-04
      # (_examples/qwentokenplan/anthropic_check): Kimi-style "data:{" SSE
      # framing (no space, parser handles both), thinking blocks stream by
      # default, tool input_schema accepted as-is.
      compatibility: anthropic
      base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic/v1
      # Context and output cap per Alibaba's own opencode provider config
      # (contextWindow 983616, maxOutputTokens 131072). Smaller than the
      # 1,000,000 window of Kimi K3 / MiniMax M3 below it in the chain, which
      # is the safe direction: a conversation that fits this rung always fits
      # the rungs a downgrade can land on.
      limit: 983616
      reserved_tokens: 131072
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      pricing:
        is_subscription: true
    - id: qwen3.8-max-preview (Token Plan)
      wire_id: qwen3.8-max-preview
      name: Qwen3.8 Max Preview (Token Plan)
      # Same surface as qwen3.8-max (Token Plan) above; see that entry's
      # comments. The preview id exists because the Token Plan meters it
      # separately (10x boost offer at the time of adding).
      compatibility: anthropic
      base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic/v1
      limit: 983616
      reserved_tokens: 131072
      supports_streaming: true
