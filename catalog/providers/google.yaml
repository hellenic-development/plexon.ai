name: google
display_name: Google Gemini
compatibility: openai
requires_api_key: true
base_url: https://generativelanguage.googleapis.com/v1beta/openai
# Gemini 4 Argon is Google's flagship (GA 2026-10-13) and the default here since
# 2026-10-17. The image rows use the GA ids Google's model page marks Stable; the
# -preview ids they replace are excluded so the sync cannot bring them back.
default_model: gemini-4-argon
sync:
    family_strip: -\d+(?:\.\d+)?
    pinned:
        - gemini-3-pro-image
        - gemini-3.1-flash-image
        - gemini-3.1-flash-lite
        - gemini-3.1-pro-preview
        - gemini-3.1-pro-preview-customtools
        - gemini-3.5-flash-lite
        - gemini-3.6-flash
        - gemini-3.8-flash
        - gemini-4-argon
        - gemini-embedding-2
        - gemma-4-26b-a4b-it
        - gemma-4-26b-a4b-it:free
        - gemma-4-31b-it
        - gemma-4-31b-it:free
    excluded:
        - gemini-3-flash-preview
        - gemini-3-pro-image-preview
        - gemini-3.1-flash-image-preview
        - gemini-3.1-flash-lite-preview
        - gemini-3.5-flash
        - gemini-3.7-flash
        - gemini-embedding-001
        - deep-research-max-preview-04-2026
