name: kosareva
display_name: Kosareva Cloud
# Kosareva Cloud (Kosareva Cloud LLC, Republic of Armenia) is a gateway that resells
# 100+ models from OpenAI, Anthropic, Google, xAI, Qwen, Moonshot, Z.ai, Mistral and
# others behind one key, billed in rubles, for customers in Russia. One host serves
# two wires: OpenAI Chat Completions at /v1/chat/completions and Anthropic Messages
# at /v1/messages. The provider is `openai` because that surface covers every text
# model (streaming, tools, image input, reasoning_effort, reasoning_content), and
# the four Claude entries override it to `anthropic`: Plexon's OpenAI client flattens
# the system prompt into one string (server/internal/api/openai.go flattenSystemBlocks),
# so Claude over Chat Completions would lose all three cache breakpoints, while the
# Anthropic client keeps them and Kosareva honours cache_control on /v1/messages.
# Same base URL for both; each client appends its own path. Every model carrying
# the override is pinned in common/catalog/critical.go (VerifyCritical demands it).
#
# Claude entries deliberately omit supports_custom_temperature: Plexon turns adaptive
# thinking on for them, Anthropic rejects a temperature next to thinking, and the
# clear that protects the first-party anthropic provider is host-gated
# (servesRealAnthropic), so on a proxy the flag's absence is what strips the field.
#
# Prices are USD per 1M tokens, converted from Kosareva's fixed RUB list at the Bank
# of Russia rate of 83.76 RUB per USD on 2026-10-16 (cbr.ru). They are approximate by
# construction: the customer pays the RUB price and the rate moves. docs/REMINDERS.md
# carries the date to refresh them. Limits and RUB figures come from the live
# GET /v1/models (2026-10-16); capability flags from Kosareva's integration package of
# 2026-09-30. cache_write is the 5-minute write price where Kosareva lists one;
# cache_read equals input where its table says "no cache discount".
#
# What is NOT here, on purpose:
#   - DeepSeek: scripts/denylist.go refuses the vendor (Google OAuth verification).
#   - MiniMax: backs the managed Plexon tier; same rule as fireworks.yaml.
#   - Perplexity Sonar: no tool calling, so it cannot drive an agent loop.
#   - Sber GigaChat, Yandex, the Russia-only Qwen builds: Kosareva marks their
#     streaming/tool flags unverified.
#   - Meta, Amazon, Xiaomi, Tencent: the serving host behind the gateway and its
#     training terms are not published, the class of finding that led to the denylist.
#   - Superseded generations (Opus/Sonnet 4.x, Opus/Sonnet 5, Fable 5, Haiku 4.5,
#     GPT-5.x flagships, GPT-4.x, Gemini 3.0 to 3.7 Flash, GLM 5.1/5.2, Kimi K2.6).
#
# supports_tool_search stays off everywhere: a gateway has no server-side tool-search
# helper. Kosareva is not on models.dev, so the weekly sync reports "keep kosareva
# (not in models.dev: leaving untouched)"; policy manual + pinned below is the defence
# in depth fireworks.yaml and minimax.yaml use, since preferLocal can only ever turn a
# boolean on and would flip supports_tool_search on for every entry it could reach.
#
# Model ids are Kosareva's own (lowercase, hyphens for dots) and go on the wire as-is.
compatibility: openai
requires_api_key: true
base_url: https://api.kosareva.cloud/v1
default_model: claude-sonnet-5-5
