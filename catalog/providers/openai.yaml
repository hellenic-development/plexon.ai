name: openai
display_name: OpenAI
compatibility: openai-responses
requires_api_key: true
supports_oauth: true
base_url: https://api.openai.com/v1
# OpenAI's models page (2026-10-17) lists three flagships: Astra for the most
# demanding work, Sol to balance intelligence and cost, Luna for high-volume
# work; GPT-6.1 Terra (2026-10-26) sits between Sol and Luna and replaced GPT-5.6
# Terra. The GPT-5 generation is retired by prefix (the pinned codex and image
# rows are immune to exclusion); the Daybreak ids are an access programme, not
# models for a picker.
#
# Wire: openai-responses, that is /v1/responses, not /v1/chat/completions.
# Measured against api.openai.com on 2026-11-04:
# - chat/completions: GPT-6 Astra, GPT-6 Luna and GPT-6.1 Terra refuse any function
#   tools ("Function tools with reasoning_effort are not supported ... use
#   /v1/responses or set reasoning_effort to 'none'"); gpt-5.3-codex refuses the
#   endpoint outright; max_tokens is refused (it wants max_completion_tokens); the
#   tools array is capped at 128 entries; {"type":"tool_search"} is refused
#   ("Supported values are: 'function' and 'custom'").
# - /v1/responses: no tool cap (213 tools accepted); reasoning summaries and
#   encrypted reasoning items come back with store:false; the effort vocabulary is
#   none/minimal/low/medium/high/xhigh/max with medium the default on every GPT-6
#   row; Astra and 6.1 Sol refuse effort none (they always think, hence
#   thinking_always_on below), Luna and 6.1 Terra accept it; temperature is refused
#   on every GPT-6 row and accepted on gpt-5.3-codex, whose default effort is none.
# supports_tool_search is absent on every row on purpose: neither OpenAI surface has
# the provider-side tool_search helper, and the desktop repo's VerifyCritical refuses
# the flag on an openai or openai-responses wire.
default_model: gpt-6-astra
sync:
    family_strip: -\d+(?:\.\d+)?
    pinned:
        - gpt-5-image
        - gpt-5-image-mini
        - gpt-5.3-codex
        - gpt-6-astra
        - gpt-6-luna
        - gpt-6.1-sol
        - gpt-6.1-terra
        - o4-mini-deep-research
    excluded:
        - gpt-3.5*
        - gpt-4*
        - gpt-5*
        - gpt-6-sol
        - gpt-daybreak*
        - o1*
        - o3*
        - o4-mini
        - o4-mini-high
        - text-embedding*
models:
    - id: chatgpt-image-latest
      name: chatgpt-image-latest
      supports_streaming: true
      supports_image: true
      release_date: "2025-12-16"
      last_updated: "2025-12-16"
    - id: gpt-5-image
      name: GPT-5 Image
      limit: 400000
      reserved_tokens: 128000
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      supports_custom_temperature: true
      pricing:
        input: 10
        output: 10
        cache_write: 10
        cache_read: 1.25
    - id: gpt-5-image-mini
      name: GPT-5 Image Mini
      limit: 400000
      reserved_tokens: 128000
      supports_streaming: true
      supports_image: true
