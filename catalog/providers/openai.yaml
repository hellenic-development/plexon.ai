name: openai
display_name: OpenAI
compatibility: openai
requires_api_key: true
supports_oauth: true
base_url: https://api.openai.com/v1
# OpenAI's models page (2026-10-17) lists three flagships: Astra for the most
# demanding work, Sol to balance intelligence and cost, Luna for high-volume
# work. The GPT-5 generation is retired by prefix (the pinned codex and image
# rows are immune to exclusion); the Daybreak ids are an access programme, not
# models for a picker.
default_model: gpt-6-astra
sync:
    family_strip: -\d+(?:\.\d+)?
    pinned:
        - gpt-5-image
        - gpt-5-image-mini
        - gpt-5.3-codex
        - gpt-6-astra
        - gpt-6-luna
        - gpt-6.1-sol
        - o4-mini-deep-research
    excluded:
        - gpt-3.5*
        - gpt-4*
        - gpt-5*
        - gpt-6-sol
        - gpt-daybreak*
        - o1*
        - o3*
        - o4-mini
        - o4-mini-high
        - text-embedding*
models:
    - id: chatgpt-image-latest
      name: chatgpt-image-latest
      supports_streaming: true
      supports_image: true
      release_date: "2025-12-16"
      last_updated: "2025-12-16"
    - id: gpt-5-image
      name: GPT-5 Image
      limit: 400000
      reserved_tokens: 128000
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      supports_tool_search: true
      supports_custom_temperature: true
      pricing:
        input: 10
        output: 10
        cache_write: 10
        cache_read: 1.25
    - id: gpt-5-image-mini
      name: GPT-5 Image Mini
      limit: 400000
      reserved_tokens: 128000
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      supports_tool_search: true
      supports_custom_temperature: true
      pricing:
        input: 2.5
        output: 2
        cache_write: 2.5
        cache_read: 0.25
    - id: gpt-5.3-codex
      name: GPT-5.3-Codex
      limit: 400000
      reserved_tokens: 128000
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      supports_tool_search: true
      supports_custom_temperature: true
      release_date: "2026-02-05"
      last_updated: "2026-02-05"
      pricing:
        input: 1.75
        output: 14
        cache_write: 1.75
        cache_read: 0.175
    - id: gpt-6-astra
      name: GPT-6 Astra
      limit: 1050000
      reserved_tokens: 128000
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_tool_search: true
      default_selection: true
      release_date: "2026-09-04"
      last_updated: "2026-09-04"
      pricing:
        input: 10
        output: 50
        cache_write: 12.5
        cache_read: 1
    - id: gpt-6-luna
      name: GPT-6 Luna
      limit: 1050000
      reserved_tokens: 128000
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
