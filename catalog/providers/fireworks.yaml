        cache_write: 0.95
        cache_read: 0.19
    - id: kimi-k2p7-code-fast
      wire_id: accounts/fireworks/routers/kimi-k2p7-code-fast
      name: Kimi K2.7 Code Fast
      limit: 262000
      reserved_tokens: 131072
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      supports_custom_temperature: true
      release_date: 2026-06-12
      pricing:
        input: 1.9
        output: 8
        cache_write: 1.9
        cache_read: 0.38
    - id: kimi-k2p6
      wire_id: accounts/fireworks/models/kimi-k2p6
      name: Kimi K2.6
      limit: 262000
      reserved_tokens: 131072
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      supports_custom_temperature: true
      release_date: 2026-04-17
      pricing:
        input: 0.95
        output: 4
        cache_write: 0.95
        cache_read: 0.16
    - id: qwen3p7-plus
      wire_id: accounts/fireworks/models/qwen3p7-plus
      name: Qwen 3.7 Plus
      limit: 262144
      # 65536 is Qwen 3.7 Plus's actual output ceiling, below the 131072 cap.
      reserved_tokens: 65536
      supports_streaming: true
      supports_image: true
      supports_reasoning: true
      supports_include_reasoning: true
      supports_custom_temperature: true
      release_date: 2026-06-12
      pricing:
        input: 0.4
        output: 1.6
        cache_write: 0.4
        cache_read: 0.08
    - id: gpt-oss-120b
      wire_id: accounts/fireworks/models/gpt-oss-120b
      name: GPT OSS 120B
      limit: 131072
      # 32768 is this model's actual output ceiling.
      reserved_tokens: 32768
      supports_streaming: true
      supports_reasoning: true
      supports_include_reasoning: true
      supports_custom_temperature: true
      release_date: 2025-08-05
      pricing:
        input: 0.15
        output: 0.6
        cache_write: 0.15
        cache_read: 0.015
sync:
    # manual + short ids is what keeps the weekly sync from flipping
    # supports_tool_search on — see the header comment.
    policy: manual
    pinned:
        - glm-5p2
        - glm-5p2-fast
        - glm-5p1
        - deepseek-v4-pro
        - deepseek-v4-flash
        - kimi-k2p7-code
        - kimi-k2p7-code-fast
        - kimi-k2p6
        - qwen3p7-plus
        - gpt-oss-120b
    # Fireworks also serves MiniMax M2.7 / M3 at roughly a quarter of MiniMax's own
    # list price, but Plexon already ships a first-party `minimax` provider whose
    # models back the managed Plexon tier and are pinned in catalog/critical.go.
    # Listing them twice under two providers would be confusing at best, so they
    # stay out. gpt-oss-20b is too small to drive an agent loop.
    excluded:
        - accounts/fireworks/models/minimax-m2p7
        - accounts/fireworks/models/minimax-m3
        - accounts/fireworks/models/gpt-oss-20b
